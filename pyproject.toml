[project]
name = "luma"
version = "0.1.0"
description = "LUMA: Benchmarking Segmentation via a Lightweight Universal Mask Adapter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fvcore==0.1.5.post20221221",
    "gitignore_parser==0.1.13",
    "hydra-core==1.3.2",
    "iopath>=0.1.10,<0.2",
    "jsonargparse[signatures]==4.38.0",
    "lightning==2.5.1.post0",
    "matplotlib==3.8.4",
    "numpy==2.4.2",
    "opencv-python>=4.13.0,<5.0",
    "pandas>=2.2.2,<3.0",
    "Pillow==11.2.1",
    "psutil>=7.0.0,<8.0",
    "PyWavelets>=1.9.0,<2.0",
    "PyYAML>=6.0.2,<7.0",
    "scikit-learn>=1.8.0,<2.0",
    "scipy>=1.15.2,<2.0",
    "timm==1.0.20",
    "torch==2.8.0",
    "torchinfo>=1.8.0,<2.0",
    "torchmetrics==1.7.1",
    "torchprofile>=0.0.4",
    "torchvision==0.23.0",
    "tqdm>=4.66.6",
    "transformers>=4.56.2,<5.0",
    "wandb>=0.19.10,<0.20",
]

[project.optional-dependencies]
instance = [
    "pycocotools>=2.0.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
