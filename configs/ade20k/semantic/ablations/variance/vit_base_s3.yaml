# Run-to-run variance, seed 3. Distinct path AND wandb name:
# the logger is resume:allow and the output dir mirrors the config
# path, so identical names would resume one run instead of three.
checkpoint_monitor: metrics/val_iou_all
compile_disabled: true
trainer:
  precision: bf16-mixed
  max_epochs: 31
  devices: 2
  logger:
    class_path: loggers.OfflineFallbackWandbLogger
    init_args:
      resume: allow
      project: luma
      name: ade20k_semantic_512_vit_base_s3
model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    attn_mask_annealing_enabled: false
    lr: 0.0001
    network:
      class_path: models.luma.LUMA
      init_args:
        num_q: 100
        num_blocks: 2
        self_a: false
        query_only_residual: true
        thread_queries: true
        query_self_attn: true
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_base_patch16_224
            patch_size: 16
            ls_init: null
            ckpt_path: weights/imagenet21k/ViT-B.pt
            vit_size: B
            pretrained: true
            emb_class: false
data:
  class_path: datasets.ade20k_semantic.ADE20KSemantic
  init_args:
    img_size:
    - 512
    - 512
    batch_size: 8
    path: data/ade20k
seed_everything: 1003
