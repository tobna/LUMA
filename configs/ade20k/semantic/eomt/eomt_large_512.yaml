checkpoint_monitor: metrics/val_iou_all
compile_disabled: true
# EoMT_Original on ADE20K Semantic
# Uses the original EoMT formulation: queries concatenated into the backbone's
# own token stream, attended via masked self-attention (no injected cross-attn).
# Backbone: ViT-L DINOv2 (vit_large_patch14_reg4_dinov2), pretrained via timm.
# Matches the original branch exactly.

trainer:
  precision: bf16-mixed
  max_epochs: 31
  devices: 2
  logger:
    class_path: loggers.OfflineFallbackWandbLogger
    init_args:
      resume: allow
      project: luma
      name: "ade20k_semantic_eomt_original_large_512"
model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    attn_mask_annealing_enabled: True
    attn_mask_annealing_start_steps: [6520, 13040, 19560, 26080]
    attn_mask_annealing_end_steps: [13040, 19560, 26080, 32600]
    lr: 1e-4
    network:
      class_path: models.eomt_original.EoMT_Original
      init_args:
        num_q: 100
        num_blocks: 4
        masked_attn_enabled: True
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: "vit_large_patch14_reg4_dinov2"
            patch_size: 16
            pretrained: True
            vit_size: "L"
            emb_class: True
data:
  class_path: datasets.ade20k_semantic.ADE20KSemantic
  init_args:
    img_size: [512, 512]
    batch_size: 8
    path: data/ade20k
