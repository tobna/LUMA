# Backbone benchmark: swin_small @ 224px. Recipe: nb2 + qor + thread + qsa + mask.
checkpoint_monitor: metrics/val_pq_all
compile_disabled: true
trainer:
  precision: bf16-mixed
  max_epochs: 31
  devices: 4
  logger:
    class_path: loggers.OfflineFallbackWandbLogger
    init_args:
      resume: allow
      project: luma
      name: ade20k_panoptic_bb_224_swin_small
model:
  class_path: training.mask_classification_panoptic.MaskClassificationPanoptic
  init_args:
    attn_mask_annealing_enabled: true
    attn_mask_annealing_start_steps:
    - 9788
    - 19576
    attn_mask_annealing_end_steps:
    - 19576
    - 29364
    lr: 0.0001
    network:
      class_path: models.luma.LUMA
      init_args:
        num_q: 200
        num_blocks: 2
        self_a: false
        query_only_residual: true
        thread_queries: true
        query_self_attn: true
        masked_cross_attn: true
        encoder:
          class_path: models.swin.Swin
          init_args:
            backbone_name: swin_small_window7
            ckpt_path: weights/imagenet21k/swin_small_patch4_window7.pt
            swin_size: S
data:
  class_path: datasets.ade20k_panoptic.ADE20KPanoptic
  init_args:
    img_size:
    - 224
    - 224
    batch_size: 4
    path: data/ade20k
    stuff_classes:
    - 0
    - 1
    - 2
    - 3
    - 4
