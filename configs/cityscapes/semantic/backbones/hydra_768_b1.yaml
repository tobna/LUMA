# Cityscapes run reported in the paper: num_blocks=1, without the later recipe flags, 768px.
checkpoint_monitor: metrics/val_iou_all
compile_disabled: true
trainer:
  precision: bf16-mixed
  max_epochs: 107
  devices: 4
  logger:
    class_path: loggers.OfflineFallbackWandbLogger
    init_args:
      resume: allow
      project: luma
      name: "cityscapes_semantic_768_hydra_small_b1"
model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    attn_mask_annealing_enabled: False
    attn_mask_annealing_start_steps: [3317, 6634, 9951, 13268]
    attn_mask_annealing_end_steps: [6634, 9951, 13268, 16585]
    lr: 1e-4
    network:
      class_path: models.luma.LUMA
      init_args:
        num_q: 100
        num_blocks: 1
        self_a: False
        encoder:
          class_path: models.hydra.Hydra
          init_args:
            backbone_name: "hydra_vit_small_patch16"
            ls_init: 1e-6
            ckpt_path: "weights/imagenet21k/HydraViT-S_IN21k.pt"
data:
  class_path: datasets.cityscapes_semantic.CityscapesSemantic
  init_args:
    img_size: [768, 768]
    batch_size: 4
    path: data/cityscapes
