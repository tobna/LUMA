# Backbone benchmark: coat @ 448px. Recipe: nb2 + qor + thread + qsa.
checkpoint_monitor: metrics/val_iou_all
compile_disabled: true
trainer:
  precision: bf16-mixed
  max_epochs: 107
  devices: 4
  strategy: ddp_find_unused_parameters_true
  logger:
    class_path: loggers.OfflineFallbackWandbLogger
    init_args:
      resume: allow
      project: luma
      name: cityscapes_semantic_bb_448_coat
model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    attn_mask_annealing_enabled: false
    lr: 0.0001
    network:
      class_path: models.luma.LUMA
      init_args:
        num_q: 100
        num_blocks: 2
        self_a: false
        query_only_residual: true
        thread_queries: true
        query_self_attn: true
        encoder:
          class_path: models.coat.coat
          init_args:
            backbone_name: coat_tiny
            ckpt_path: weights/imagenet21k/CoaT-Ti_IN21k.pt
data:
  class_path: datasets.cityscapes_semantic.CityscapesSemantic
  init_args:
    img_size:
    - 448
    - 448
    batch_size: 4
    path: data/cityscapes
