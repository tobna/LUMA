# Pretraining sweep: siglip_large @ 1024px (headline resolution only).
checkpoint_monitor: metrics/val_iou_all
compile_disabled: true
trainer:
  precision: bf16-mixed
  max_epochs: 107
  devices: 8
  strategy: ddp_find_unused_parameters_true
  logger:
    class_path: loggers.OfflineFallbackWandbLogger
    init_args:
      resume: allow
      project: luma
      name: cityscapes_semantic_pt_1024_siglip_large
model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    attn_mask_annealing_enabled: false
    lr: 0.0001
    network:
      class_path: models.luma.LUMA
      init_args:
        num_q: 100
        num_blocks: 2
        self_a: false
        query_only_residual: true
        thread_queries: true
        query_self_attn: true
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_large_patch16_siglip_512.v2_webli
            patch_size: 16
            pretrained: true
            vit_size: L
            emb_class: true
            ls_init: null
data:
  class_path: datasets.cityscapes_semantic.CityscapesSemantic
  init_args:
    img_size:
    - 1024
    - 1024
    batch_size: 2
    path: data/cityscapes
