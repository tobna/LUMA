# Scaling grid: dinov2_small @ 512px.
checkpoint_monitor: metrics/val_iou_all
compile_disabled: true
trainer:
  precision: bf16-mixed
  max_epochs: 107
  devices: 4
  logger:
    class_path: loggers.OfflineFallbackWandbLogger
    init_args:
      resume: allow
      project: luma
      name: cityscapes_semantic_sc_512_dinov2_small
model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    attn_mask_annealing_enabled: false
    lr: 0.0001
    network:
      class_path: models.luma.LUMA
      init_args:
        num_q: 100
        num_blocks: 2
        self_a: false
        query_only_residual: true
        thread_queries: true
        query_self_attn: true
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2
            patch_size: 14
            pretrained: true
            vit_size: S
            emb_class: true
data:
  class_path: datasets.cityscapes_semantic.CityscapesSemantic
  init_args:
    img_size:
    - 512
    - 512
    batch_size: 4
    path: data/cityscapes
