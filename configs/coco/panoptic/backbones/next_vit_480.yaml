# Backbone benchmark: next_vit @ 480px. Recipe: nb2 + qor + thread + qsa + mask.
checkpoint_monitor: metrics/val_pq_all
compile_disabled: true
trainer:
  precision: bf16-mixed
  max_epochs: 12
  devices: 4
  strategy: ddp_find_unused_parameters_true
  logger:
    class_path: loggers.OfflineFallbackWandbLogger
    init_args:
      resume: allow
      project: luma
      name: coco_panoptic_bb_480_next_vit
model:
  class_path: training.mask_classification_panoptic.MaskClassificationPanoptic
  init_args:
    attn_mask_annealing_enabled: true
    attn_mask_annealing_start_steps:
    - 22176
    - 44352
    attn_mask_annealing_end_steps:
    - 44352
    - 66528
    lr: 0.0001
    network:
      class_path: models.luma.LUMA
      init_args:
        num_q: 200
        num_blocks: 2
        self_a: false
        query_only_residual: true
        thread_queries: true
        query_self_attn: true
        masked_cross_attn: true
        encoder:
          class_path: models.next_vit.NextViT
          init_args:
            backbone_name: nextvit_small_cus
            ckpt_path: weights/imagenet21k/NextViT-S_IN21k.pt
            num_blocks: 2
            num_q: 200
data:
  class_path: datasets.coco_panoptic.COCOPanoptic
  init_args:
    img_size:
    - 480
    - 480
    batch_size: 4
    path: data/coco
    stuff_classes:
    - 80
    - 81
    - 82
    - 83
